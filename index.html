<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人影视聚合中心</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 20px; }
    .header { max-width: 1400px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: #1e293b; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .logo { font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .search-box { display: flex; gap: 10px; flex: 1; max-width: 600px; }
    select, input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; font-size: 14px; outline: none; background: #0f172a; color: #fff; }
    select { cursor: pointer; }
    input { flex: 1; }
    button { background: #0284c7; border: none; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    button:hover { background: #0ea5e9; }
    
    .main-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
    
    .player-section { display: none; background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    video { width: 100%; height: 100%; }
    .playing-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #38bdf8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border-color: #0284c7; }
    .poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #334155; }
    .card-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; justify-content: space-between; }
    .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note { font-size: 12px; color: #94a3b8; }
    .tip { text-align: center; color: #94a3b8; grid-column: 1 / -1; padding: 40px; font-size: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🎬 私人影视聚合</div>
    <div class="search-box">
      <select id="apiSelect">
        <option value="https://cj.ffzyapi.com/api.php/provide/vod/">非凡资源（推荐）</option>
        <option value="https://cj.lziapi.com/api.php/provide/vod/">量子资源</option>
        <option value="https://jszyapi.com/api.php/provide/vod/">极速资源</option>
        <option value="https://api.wujinapi.me/api.php/provide/vod/">无尽资源</option>
        <option value="https://bfzyapi.com/api.php/provide/vod/">暴风资源</option>
      </select>
      <input type="text" id="keyword" placeholder="输入片名搜索（如：叶问、复仇者联盟）..." onkeydown="if(event.key==='Enter') searchVod()">
      <button onclick="searchVod()">搜索</button>
    </div>
  </div>

  <div class="main-container">
    <div class="player-section" id="playerSection">
      <div class="playing-title" id="playingTitle">正在播放：--</div>
      <div class="player-box">
        <video id="videoPlayer" controls></video>
      </div>
      <button onclick="closePlayer()" style="background:#475569; margin-top:5px;">关闭播放器并返回列表</button>
    </div>

    <div class="grid" id="results">
      <div class="tip">正在连接接口加载影视数据...</div>
    </div>
  </div>

  <script>
    let hls = null;

    async function searchVod() {
      const api = document.getElementById('apiSelect').value;
      const kw = document.getElementById('keyword').value.trim();
      const resultsDiv = document.getElementById('results');
      
      resultsDiv.innerHTML = '<div class="tip">正在请求资源，请稍候...</div>';

      // 尝试两个不同的公共代理通道以防某一个失效
      const targetUrl = `${api}?ac=detail${kw ? '&wd=' + encodeURIComponent(kw) : ''}`;
      const proxies = [
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      let data = null;
      for (let proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            data = await res.json();
            break;
          }
        } catch (e) {
          continue; // 如果这个代理失败，自动尝试下一个
        }
      }

      if (!data || !data.list || data.list.length === 0) {
        resultsDiv.innerHTML = '<div class="tip">当前接口响应超时或无数据，请尝试在左上角下拉菜单切换为【非凡资源】或【极速资源】再试。</div>';
        return;
      }

      resultsDiv.innerHTML = '';
      data.list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playVod(item);
        
        card.innerHTML = `
          <img class="poster" src="${item.vod_pic || ''}" alt="${item.vod_name}" onerror="this.src='https://via.placeholder.com/160x220?text=暂无海报'">
          <div class="card-info">
            <div class="title" title="${item.vod_name}">${item.vod_name}</div>
            <div class="note">${item.vod_remarks || '高清'}</div>
          </div>
        `;
        resultsDiv.appendChild(card);
      });
    }

    function playVod(item) {
      const section = document.getElementById('playerSection');
      const title = document.getElementById('playingTitle');
      const video = document.getElementById('videoPlayer');
      
      section.style.display = 'block';
      title.innerText = `正在播放：${item.vod_name} (${item.vod_remarks || ''})`;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const playUrlData = item.vod_play_url || '';
      const m3u8Match = playUrlData.match(/https?:\/\/[^\s$#]+\.m3u8/);

      if (!m3u8Match) {
        alert('该影片暂无直接可用的 M3U8 播放链接');
        return;
      }

      const videoUrl = m3u8Match[0];

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(videoUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoUrl;
        video.play();
      }
    }

    function closePlayer() {
      const section = document.getElementById('playerSection');
      const video = document.getElementById('videoPlayer');
      video.pause();
      section.style.display = 'none';
    }

    // 默认打开时加载非凡资源
    window.onload = () => {
      searchVod();
    };
  </script>
</body>
</html>
